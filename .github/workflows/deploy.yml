name: Sync episodes and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * *"   # daily, 6:17am Mountain
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new episodes from YouTube
        run: python3 tools/sync_youtube.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Save new episodes to the repo
        run: |
          if ! git diff --quiet data/episodes.json; then
            git config user.name "yiwr-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/episodes.json
            git commit -m "Add new episodes from YouTube"
            git push
          fi
      - name: Build site
        run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
